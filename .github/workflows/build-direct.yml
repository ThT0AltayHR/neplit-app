name: Build Neplit Direct Patch APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK build-tools kur
        uses: android-actions/setup-android@v3

      - name: build-tools PATH'e ekle
        run: |
          BT=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          echo "Build-tools: $BT"
          echo "$BT" >> $GITHUB_PATH

      # ─── Mevcut APK'yı indir (apktool rebuild YOK) ──────────────────────────
      - name: Kaynak APK'yı indir
        run: |
          curl -L \
            "https://github.com/${{ github.repository }}/releases/download/apk-v20260729-102301/neplit-2-orig-manifest.apk" \
            -o source.apk
          echo "Kaynak APK: $(du -h source.apk | cut -f1)"
          python3 -c "
          import zipfile
          with zipfile.ZipFile('source.apk','r') as z:
              bad = z.testzip()
              entries = z.infolist()
              print(f'ZIP durum: {\"TAMAM\" if bad is None else \"HATA: \"+bad}')
              print(f'Toplam dosya: {len(entries)}')
              has_mf = any(e.filename==\"AndroidManifest.xml\" for e in entries)
              print(f'AndroidManifest.xml: {has_mf}')
          "

      # ─── Binary XML patcher + APK yeniden paketleme scripti ─────────────────
      - name: Patch scripti oluştur
        run: |
          cat > /tmp/patch_apk.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          APK'nın içindeki binary AndroidManifest.xml'i yamalar:
            - manifest elementinden requiredSplitTypes ve splitTypes kaldırılır
            - split ile ilgili meta-data elementleri sıfırlanır
          Apktool kullanılmaz — doğrudan ZIP manipülasyonu.
          Dosya boyutu DEĞİŞMEZ, tüm offsetler geçerli kalır.
          """
          import struct, zipfile, os, sys

          # ─── Sabitler ────────────────────────────────────────────────────────
          TYPE_NULL   = 0x00
          TYPE_STRING = 0x03

          STORE_NAMES = {'resources.arsc'}
          STORE_EXTS  = {'.dex','.so','.png','.webp','.jpg','.jpeg','.gif',
                         '.bmp','.tflite','.profm','.prof','.bundle','.binarypb',
                         '.mp4','.mp3','.ogg','.wav','.ttf','.otf','.pem'}

          def ru32(d, o): return struct.unpack_from('<I', d, o)[0]
          def ru16(d, o): return struct.unpack_from('<H', d, o)[0]
          def wu32(d, o, v): struct.pack_into('<I', d, o, v)
          def wu16(d, o, v): struct.pack_into('<H', d, o, v)

          # ─── String pool ayrıştırıcı ─────────────────────────────────────────
          def parse_string_pool(data):
              fhdr = ru16(data, 2)          # file header size (=8)
              sp   = fhdr                   # string pool offset

              assert ru16(data, sp) == 0x0001, "string pool yok"
              sp_hdr  = ru16(data, sp + 2)
              sp_size = ru32(data, sp + 4)
              count   = ru32(data, sp + 8)
              flags   = ru32(data, sp + 16)
              str_off = ru32(data, sp + 20)

              is_utf8    = bool(flags & 0x100)
              off_base   = sp + sp_hdr
              str_base   = sp + str_off

              strings = []
              for i in range(count):
                  rel = ru32(data, off_base + i * 4)
                  p   = str_base + rel
                  if is_utf8:
                      cl = data[p]; p += 2 if cl & 0x80 else 1
                      if cl & 0x80: cl &= 0x7F; cl = (cl << 8) | data[p-1]
                      bl = data[p]
                      if bl & 0x80: bl = ((bl & 0x7F) << 8) | data[p+1]; p += 2
                      else: p += 1
                      s  = data[p:p+bl].decode('utf-8', errors='replace')
                  else:
                      cl = ru16(data, p)
                      if cl & 0x8000:
                          cl = ((cl & 0x7FFF) << 16) | ru16(data, p+2); p += 4
                      else:
                          p += 2
                      s = data[p:p+cl*2].decode('utf-16-le', errors='replace')
                  strings.append(s)

              return strings, sp + sp_size

          # ─── Attribute sıfırlayıcı ────────────────────────────────────────────
          def null_attr(data, off):
              wu32(data, off + 8,  0xFFFFFFFF)  # rawValue = absent
              wu16(data, off + 12, TYPE_NULL)    # type = NULL
              wu16(data, off + 14, 0x0000)
              wu32(data, off + 16, 0x00000000)

          # ─── Binary manifest yamalaması ───────────────────────────────────────
          MANIFEST_ATTRS = {'requiredSplitTypes', 'splitTypes'}
          META_NAMES = {
              'com.android.vending.splits.required',
              'com.android.stamp.source',
              'com.android.stamp.type',
              'com.android.vending.splits',
              'com.android.vending.derived.apk.id',
          }

          def patch_manifest(raw: bytes) -> bytes:
              assert ru16(raw, 0) == 0x0003, "binary XML değil"
              data   = bytearray(raw)
              strs, nodes = parse_string_pool(bytes(data))

              print(f"  String pool: {len(strs)} adet | UTF-8: {bool(ru32(bytes(data), ru16(bytes(data),2)+16) & 0x100)}")
              for t in MANIFEST_ATTRS | META_NAMES:
                  print(f"  {'[✓]' if t in strs else '[✗]'} {t}")

              off = nodes
              if off < len(data) and ru16(data, off) == 0x0180:
                  off += ru32(data, off + 4)

              actions = []
              while off + 8 <= len(data):
                  ctype  = ru16(data, off)
                  chdr   = ru16(data, off + 2)
                  csize  = ru32(data, off + 4)
                  if csize == 0: break

                  if ctype == 0x0102:  # START_ELEMENT
                      ename_idx  = ru32(data, off + 12)
                      attr_start = ru16(data, off + 16)
                      attr_size  = ru16(data, off + 18)
                      attr_count = ru16(data, off + 20)
                      ename = strs[ename_idx] if ename_idx < len(strs) else ""

                      if ename == 'manifest':
                          a = off + attr_start
                          for _ in range(attr_count):
                              ni = ru32(data, a + 4)
                              nm = strs[ni] if ni < len(strs) else ""
                              if nm in MANIFEST_ATTRS:
                                  print(f"  → manifest attr '{nm}' sıfırlandı")
                                  null_attr(data, a)
                                  actions.append(f"ATTR:{nm}")
                              a += attr_size

                      elif ename == 'meta-data':
                          a = off + attr_start
                          meta_name = None
                          for _ in range(attr_count):
                              ni = ru32(data, a + 4)
                              nm = strs[ni] if ni < len(strs) else ""
                              tp = ru16(data, a + 12)
                              dv = ru32(data, a + 16)
                              if nm == 'name' and tp == TYPE_STRING and dv < len(strs):
                                  meta_name = strs[dv]
                              a += attr_size
                          if meta_name in META_NAMES:
                              a = off + attr_start
                              for _ in range(attr_count):
                                  null_attr(data, a)
                                  a += attr_size
                              print(f"  → meta-data '{meta_name}' sıfırlandı")
                              actions.append(f"META:{meta_name}")

                  off += csize

              print(f"  Toplam {len(actions)} düzeltme uygulandı")
              assert len(data) == len(raw), "boyut değişti!"
              return bytes(data)

          # ─── APK yeniden paketleme (temiz ZIP) ───────────────────────────────
          def repack_apk(input_path, output_path, patched_manifest: bytes):
              with zipfile.ZipFile(input_path, 'r') as zin:
                  infos = zin.infolist()
                  # META-INF (imza dosyaları) hariç tut — apksigner ekleyecek
                  infos = [i for i in infos
                           if not i.filename.startswith('META-INF/')]

                  # resources.arsc en önde
                  infos.sort(key=lambda x: (
                      0 if x.filename == 'resources.arsc' else 1, x.filename))

                  with zipfile.ZipFile(output_path, 'w', allowZip64=False) as zout:
                      for info in infos:
                          data = (patched_manifest
                                  if info.filename == 'AndroidManifest.xml'
                                  else zin.read(info.filename))
                          n = zipfile.ZipInfo(info.filename)
                          n.date_time    = (2024, 1, 1, 0, 0, 0)
                          n.extra        = b''
                          n.comment      = b''
                          n.flag_bits    = 0
                          ext = os.path.splitext(os.path.basename(info.filename))[1].lower()
                          if info.filename in STORE_NAMES or ext in STORE_EXTS:
                              n.compress_type = zipfile.ZIP_STORED
                          else:
                              n.compress_type = zipfile.ZIP_DEFLATED
                          zout.writestr(n, data)

              with zipfile.ZipFile(output_path, 'r') as z:
                  bad = z.testzip()
                  entries = z.infolist()
                  res = next((e for e in entries if e.filename=='resources.arsc'), None)
                  print(f"ZIP: {'TAMAM' if bad is None else 'HATA: '+bad}")
                  print(f"Dosya sayısı: {len(entries)}")
                  if res: print(f"resources.arsc compress={res.compress_type} (0=STORED)")
                  bad_extra = [e for e in entries if e.extra]
                  print(f"Extra field: {len(bad_extra)} dosya")

          # ─── Ana ─────────────────────────────────────────────────────────────
          input_apk  = sys.argv[1]
          output_apk = sys.argv[2]

          print(f"\n=== Kaynak APK: {input_apk} ({os.path.getsize(input_apk)/1024/1024:.1f} MB) ===")

          with zipfile.ZipFile(input_apk, 'r') as z:
              raw_manifest = z.read('AndroidManifest.xml')

          print(f"\n=== Binary manifest patch ({len(raw_manifest)} byte) ===")
          patched = patch_manifest(raw_manifest)

          # Doğrulama: hedef string'ler manifest'te hâlâ var mı?
          for kw in [b'requiredSplitTypes', b'vending.splits.required',
                     b'vending.splits\x00', b'derived.apk.id']:
              present = kw in patched
              print(f"  {'⚠ HÂLÂ VAR' if present else '✓ YOK'}: {kw}")

          print(f"\n=== APK yeniden paketleniyor ===")
          repack_apk(input_apk, output_apk, patched)
          print(f"Çıktı APK: {os.path.getsize(output_apk)/1024/1024:.1f} MB")
          PYEOF
          echo "Patch scripti hazır."

      - name: Binary manifest patch + APK repack
        run: |
          python3 /tmp/patch_apk.py source.apk repacked.apk

      # ─── Keystore ────────────────────────────────────────────────────────────
      - name: Keystore oluştur
        run: |
          keytool -genkey -v \
            -keystore neplit.keystore \
            -alias neplit \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Neplit,OU=Dev,O=Neplit,L=TR,ST=TR,C=TR"

      # ─── zipalign ────────────────────────────────────────────────────────────
      - name: zipalign
        run: |
          zipalign -f -v -p 4 repacked.apk aligned.apk
          zipalign -c -v 4 aligned.apk && echo "✓ zipalign TAMAM" || echo "✗ zipalign HATA"

      # ─── apksigner v1+v2+v3 ──────────────────────────────────────────────────
      - name: apksigner ile imzala
        run: |
          apksigner sign \
            --ks neplit.keystore \
            --ks-key-alias neplit \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out neplit-final.apk \
            aligned.apk
          echo ""
          echo "=== İmza doğrulama ==="
          apksigner verify --verbose neplit-final.apk 2>&1 | \
            grep -E "Verifies|v[123]|Error"
          echo "APK boyutu: $(du -h neplit-final.apk | cut -f1)"

      # ─── Manifest doğrulama ───────────────────────────────────────────────────
      - name: Manifest ve ZIP doğrulama
        run: |
          python3 - << 'PYEOF'
          import zipfile

          with zipfile.ZipFile('neplit-final.apk','r') as z:
              entries = z.infolist()
              bad = z.testzip()
              mf  = z.read('AndroidManifest.xml')

          print(f"ZIP: {'✓ TAMAM' if bad is None else '✗ HATA: '+bad}")
          print(f"Dosya sayısı: {len(entries)}")

          checks = {
              'requiredSplitTypes kaldırıldı': b'requiredSplitTypes' not in mf,
              'splits.required kaldırıldı':    b'splits.required'    not in mf,
              'vending.splits kaldırıldı':     b'vending.splits\x00' not in mf,
              'derived.apk.id kaldırıldı':     b'derived.apk.id'     not in mf,
              'stamp.type kaldırıldı':         b'stamp.type'         not in mf,
          }
          for desc, ok in checks.items():
              print(f"  {'✓' if ok else '✗'} {desc}")

          res = next((e for e in entries if e.filename=='resources.arsc'), None)
          if res:
              print(f"resources.arsc: {'✓ STORED' if res.compress_type==0 else '✗ SIKIŞTIRILMIŞ'}")

          bad_extra = [e.filename for e in entries if e.extra]
          print(f"Extra field: {len(bad_extra)} dosya {'✓' if not bad_extra else '(temizlenmeli)'}")
          PYEOF

          AAPT=$(find $ANDROID_HOME -name "aapt" -type f 2>/dev/null | head -1)
          if [ -n "$AAPT" ]; then
            echo ""
            echo "=== aapt badging ==="
            "$AAPT" dump badging neplit-final.apk 2>&1 | \
              grep -E "^package|^sdkVersion|^targetSdk|native-code|split" | head -15
          fi
        continue-on-error: true

      # ─── Release ─────────────────────────────────────────────────────────────
      - name: Versiyon belirle
        id: version
        run: |
          DATE=$(date +'%Y%m%d-%H%M%S')
          echo "tag=final-v${DATE}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Neplit Final ${{ steps.version.outputs.date }}"
          body: |
            ## Neplit APK — Final Kararlı Sürüm

            ### ✅ Düzeltilen sorunlar

            | Hata | Çözüm |
            |------|-------|
            | **"Telefonla uyumlu değil"** | Binary AndroidManifest.xml doğrudan patch'lendi (apktool rebuild yok). `requiredSplitTypes` ve `splitTypes` attribute'ları TYPE_NULL yapıldı |
            | **Split APK zorlaması** | `com.android.vending.splits.required`, `com.android.vending.splits`, `com.android.vending.derived.apk.id`, `com.android.stamp.source/type` meta-data'ları sıfırlandı |
            | **Parse hatası riski** | Apktool rebuild YOK — orijinal binary resources.arsc ve tüm dosyalar aynen korundu, sadece manifest yamalandı |
            | **ZIP yapı sorunları** | Temiz ZIP: extra field sıfır, resources.arsc STORED formatında, META-INF sıfırlanıp apksigner tarafından yeniden oluşturuldu |
            | **İmza** | apksigner v1+v2+v3 (Android 5 → 16 tüm sürümler) |

            ### 📱 Kurulum
            1. `neplit-final.apk` dosyasını indir (76-77 MB)
            2. **Telefon Ayarları → Güvenlik → Bilinmeyen kaynaklara izin ver**
            3. Dosya yöneticisinden APK'ya dokun → Kur

            ### 📋 Teknik
            | Alan | Değer |
            |------|-------|
            | Paket | `com.neplit.app` |
            | Min Android | 7.0 (API 24) |
            | Hedef SDK | 36 |
            | Sürüm | 2.193.0 |
            | İmza | v1 + v2 + v3 |

          files: neplit-final.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artifact yedek
        uses: actions/upload-artifact@v4
        with:
          name: neplit-final
          path: neplit-final.apk
          retention-days: 30
