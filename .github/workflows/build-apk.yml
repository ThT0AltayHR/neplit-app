name: Build Neplit APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: apktool 2.9.3 kur
        run: |
          mkdir -p $HOME/apktool
          curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar \
            -o $HOME/apktool/apktool.jar
          curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool \
            -o $HOME/apktool/apktool
          chmod +x $HOME/apktool/apktool
          echo "$HOME/apktool" >> $GITHUB_PATH
          echo "apktool kuruldu: $(java -jar $HOME/apktool/apktool.jar --version)"

      - name: Android SDK build-tools kur
        uses: android-actions/setup-android@v3

      - name: build-tools araçlarını PATH'e ekle
        run: |
          BT=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          echo "Kullanılan build-tools: $BT"
          echo "$BT" >> $GITHUB_PATH

      - name: Release'ten APK kaynak zip'i indir
        run: |
          curl -L \
            "https://github.com/${{ github.repository }}/releases/download/source-v1/neplit_source.zip" \
            -o neplit_source.zip
          unzip -q neplit_source.zip
          echo "Kaynak dosyalar:"
          ls -la neplit_build/

      - name: APK derle (apktool + aapt2)
        run: |
          cd neplit_build
          apktool b . --output ../neplit-raw.apk --use-aapt2
          cd ..
          echo "Ham APK boyutu: $(ls -lh neplit-raw.apk)"

      - name: APK'yı temiz ZIP olarak yeniden paketle (extra-field düzelt)
        run: |
          # apktool bazı dosyaları orijinalden kopyalarken bozuk ZIP extra-field bırakır.
          # Android bu durumda APK'yı parse edemez. Yeniden paketleyerek temizliyoruz.
          mkdir -p apk_repacked
          unzip -q neplit-raw.apk -d apk_repacked/
          echo "Çıkarılan dosya sayısı: $(find apk_repacked -type f | wc -l)"

          # Temiz ZIP oluştur - extra-field/UID/GID bilgisi olmadan
          cd apk_repacked

          # resources.arsc mutlaka STORED (sıkıştırılmamış) olmalı - Android bunu bellekle eşler
          zip -0 -X ../neplit-clean.apk resources.arsc
          echo "resources.arsc eklendi (STORED)"

          # Geri kalan tüm dosyalar - DEX dosyaları ve büyük binary dosyalar için düşük sıkıştırma
          find . -type f ! -name "resources.arsc" | sort | while read f; do
            fname="${f#./}"
            # DEX, binary asset, native lib, resim - STORED bırak (daha hızlı yükleme)
            if echo "$fname" | grep -qE '\.(dex|so|webp|png|jpg|gif|tflite|binarypb|profm|prof|bundle)$'; then
              zip -0 -X ../neplit-clean.apk "$fname"
            else
              zip -9 -X ../neplit-clean.apk "$fname"
            fi
          done

          cd ..
          echo "Temiz APK boyutu: $(ls -lh neplit-clean.apk)"
          echo "ZIP bütünlük kontrolü:"
          unzip -t neplit-clean.apk 2>&1 | grep -E "error|Error|bad" || echo "Hata yok - ZIP temiz"

      - name: zipalign uygula
        run: |
          zipalign -v -p 4 neplit-clean.apk neplit-aligned.apk
          echo "zipalign doğrulama:"
          zipalign -c -v 4 neplit-aligned.apk && echo "HIZALANMA TAMAM" || echo "HIZALANMA HATASI"
          ls -lh neplit-aligned.apk

      - name: Keystore oluştur ve apksigner ile imzala (v1+v2+v3)
        run: |
          keytool -genkey -v \
            -keystore neplit.keystore \
            -alias neplit \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Neplit, OU=Dev, O=Neplit, L=TR, ST=TR, C=TR"

          apksigner sign \
            --ks neplit.keystore \
            --ks-key-alias neplit \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out neplit-signed.apk \
            neplit-aligned.apk

          echo "=== İmza Doğrulama ==="
          apksigner verify --verbose --print-certs neplit-signed.apk
          echo "Son APK boyutu: $(ls -lh neplit-signed.apk)"

      - name: Versiyon etiketini belirle
        id: version
        run: |
          DATE=$(date +'%Y%m%d-%H%M%S')
          echo "tag=apk-v${DATE}" >> $GITHUB_OUTPUT
          echo "name=Neplit APK - ${DATE}" >> $GITHUB_OUTPUT

      - name: GitHub Release oluştur ve APK yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## Neplit APK - Otomatik Derleme

            Bu APK GitHub Actions tarafından otomatik olarak derlenmiştir.
            Derleme: apktool 2.9.3 + aapt2 + ZIP repack + zipalign + apksigner (v1+v2+v3)

            ### Kurulum
            1. `neplit-signed.apk` dosyasını indirin
            2. Telefon ayarlarından **Bilinmeyen kaynaklara izin ver** seçeneğini etkinleştirin
            3. APK dosyasını açıp kurun

            ### Paket Bilgileri
            - Paket: `com.neplit.app`
            - Min Android: 7.0 (API 24)
            - Hedef SDK: Android 16 (API 36)
            - Sürüm: 2.193.0
          files: neplit-signed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: APK'yı artifact olarak da kaydet (yedek)
        uses: actions/upload-artifact@v4
        with:
          name: neplit-apk
          path: neplit-signed.apk
          retention-days: 30
